<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fantasienest - Schatzkarten-Suche</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            background-color: #1e272e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
        }

        /* Die Schatzkarte im exakten 3:2 Format */
        #karte-buehne {
            position: relative;
            width: 900px;
            max-width: 96vw;
            max-height: 78vh;
            aspect-ratio: 3 / 2;
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* Unsichtbare Klick-Felder über den 3 versteckten Objekten */
        .such-zone {
            position: absolute;
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            cursor: pointer;
            background-color: transparent;
            border: 4px solid transparent;
            transition: all 0.3s ease;
        }

        /* Sobald das Kind das Objekt gefunden hat */
        .such-zone.gefunden {
            border: 5px solid #e74c3c;
            background-color: rgba(255, 235, 59, 0.25);
            box-shadow: 0 0 15px #f1c40f;
            cursor: default;
            animation: plopp 0.4s ease;
        }

        @keyframes plopp {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            70% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Such-Leiste unten mit den 3 gesuchten Begriffen */
        #such-liste {
            margin-top: 14px;
            background: rgba(255, 255, 255, 0.94);
            padding: 10px 28px;
            border-radius: 30px;
            display: flex;
            gap: 28px;
            font-size: 19px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            justify-content: center;
        }

        .such-wort {
            color: #2c3e50;
            font-weight: bold;
            transition: all 0.3s;
        }

        /* Durchstreichen und grün färben, wenn gefunden */
        .such-wort.abgehakt {
            color: #27ae60;
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* Gewinn-Fenster */
        #gewonnen-box {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.96);
            padding: 25px 40px;
            border-radius: 20px;
            border: 5px solid #f39c12;
            text-align: center;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #gewonnen-box h2 { margin: 0 0 10px 0; color: #333; font-size: 26px; }
        #gewonnen-box p { margin: 0 0 18px 0; color: #555; font-size: 18px; }
        #gewonnen-box button {
            background: #27ae60; color: white; border: none;
            padding: 12px 24px; font-size: 18px; border-radius: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="karte-buehne">
    <!-- 1. DIE PALME (Links auf der Karte) -->
    <div class="such-zone" data-ziel="wort1" style="left: 25.0%; top: 55.5%; width: 9%;"></div>
    
    <!-- 2. DER GROSSE STEIN IM FLUSS (Unten in der Flussbiegung) -->
    <div class="such-zone" data-ziel="wort2" style="left: 44.8%; top: 61.5%; width: 8%;"></div>
    
    <!-- 3. DIE RUINE (Rechts oben unter den Bergen) -->
    <div class="such-zone" data-ziel="wort3" style="left: 71.0%; top: 41.0%; width: 15%;"></div>

    <!-- Gewinn-Fenster -->
    <div id="gewonnen-box">
        <h2>Schatz gefunden! 🗺️💎</h2>
        <p>Du hast die Palme, den Flussstein und die Ruine entdeckt!</p>
        <button onclick="location.reload()">Nochmal suchen</button>
    </div>
</div>

<!-- Such-Leiste unter der Karte -->
<div id="such-liste">
    <span class="such-wort" id="wort1">🌴 Die Palme</span>
    <span class="such-wort" id="wort2">🪨 Stein im Fluss</span>
    <span class="such-wort" id="wort3">🏛️ Die Ruine</span>
</div>

<script>
    // Karte immer frisch laden (ohne Cache-Probleme)
    document.getElementById('karte-buehne').style.backgroundImage = `url('images/schatzkarte.png?t=${Date.now()}')`;

    const zonen = document.querySelectorAll('.such-zone');
    let gefundenAnzahl = 0;

    zonen.forEach(zone => {
        zone.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (zone.classList.contains('gefunden')) return;

            // 1. Leuchtenden Kreis auf der Karte anzeigen
            zone.classList.add('gefunden');

            // 2. Passendes Wort unten durchstreichen
            const zielId = zone.dataset.ziel;
            document.getElementById(zielId).classList.add('abgehakt');

            // 3. Prüfen, ob alle 3 gefunden wurden
            gefundenAnzahl++;
            if (gefundenAnzahl === zonen.length) {
                setTimeout(() => {
                    document.getElementById('gewonnen-box').style.display = 'block';
                }, 500);
            }
        });
    });
</script>

</body>
</html>
