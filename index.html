<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fantasienest - Schatten-Rätsel</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
        }

        #spiel-buehne {
            position: relative;
            width: 900px;
            max-width: 98vw;
            aspect-ratio: 16 / 10;
            background-image: url('images/hintergrund.png');
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* Reihe der 4 Schatten oben */
        #schatten-reihe {
            position: absolute;
            top: 12%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 4%;
        }

        /* Reihe der 4 bunten Symbole unten */
        #symbol-reihe {
            position: absolute;
            bottom: 8%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 4%;
        }

        .slot, .karte-platz {
            width: 18%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .schatten-bild {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .symbol-bild {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: grab;
            touch-action: none;
            transition: transform 0.15s;
            z-index: 10;
        }

        .symbol-bild:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        /* Erfolgs-Nachricht am Ende */
        #gewonnen-box {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 20px;
            border: 5px solid #ffcc00;
            text-align: center;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        #gewonnen-box h2 { margin: 0 0 15px 0; color: #333; font-size: 28px; }
        #gewonnen-box button {
            background: #4caf50; color: white; border: none;
            padding: 12px 24px; font-size: 18px; border-radius: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="spiel-buehne">
    <!-- Obere Reihe: Die 4 Schatten -->
    <div id="schatten-reihe">
        <div class="slot" data-id="1"><img src="images/schatten1.png" class="schatten-bild"></div>
        <div class="slot" data-id="2"><img src="images/schatten2.png" class="schatten-bild"></div>
        <div class="slot" data-id="3"><img src="images/schatten3.png" class="schatten-bild"></div>
        <div class="slot" data-id="4"><img src="images/schatten4.png" class="schatten-bild"></div>
    </div>

    <!-- Untere Reihe: Die 4 bunten Symbole (gemischt) -->
    <div id="symbol-reihe">
        <div class="karte-platz"><img src="images/symbol3.png" class="symbol-bild" data-id="3"></div>
        <div class="karte-platz"><img src="images/symbol1.png" class="symbol-bild" data-id="1"></div>
        <div class="karte-platz"><img src="images/symbol4.png" class="symbol-bild" data-id="4"></div>
        <div class="karte-platz"><img src="images/symbol2.png" class="symbol-bild" data-id="2"></div>
    </div>

    <!-- Gewinn-Fenster -->
    <div id="gewonnen-box">
        <h2>Super gemacht! 🌟</h2>
        <p>Du hast alle 4 Schatten gefunden!</p>
        <button onclick="location.reload()">Nochmal spielen</button>
    </div>
</div>

<script>
    const symbole = document.querySelectorAll('.symbol-bild');
    const schattenSlots = document.querySelectorAll('.slot');
    let geloest = 0;

    symbole.forEach(symbol => {
        let startX = 0, startY = 0;
        let ziehtGerade = false;

        // Start beim Antippen (Maus & Touch)
        symbol.addEventListener('pointerdown', (e) => {
            if (symbol.dataset.fertig === 'true') return;
            ziehtGerade = true;
            symbol.setPointerCapture(e.pointerId);
            startX = e.clientX;
            startY = e.clientY;
            symbol.style.zIndex = 50;
            symbol.style.transition = 'none';
        });

        // Bewegung mit Finger oder Maus
        symbol.addEventListener('pointermove', (e) => {
            if (!ziehtGerade) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            symbol.style.transform = `translate(${dx}px, ${dy}px) scale(1.1)`;
        });

        // Loslassen und prüfen, ob es über dem richtigen Schatten liegt
        symbol.addEventListener('pointerup', (e) => {
            if (!ziehtGerade) return;
            ziehtGerade = false;
            symbol.releasePointerCapture(e.pointerId);

            const symRect = symbol.getBoundingClientRect();
            const symMitteX = symRect.left + symRect.width / 2;
            const symMitteY = symRect.top + symRect.height / 2;

            let treffer = false;

            schattenSlots.forEach(slot => {
                if (slot.dataset.id === symbol.dataset.id) {
                    const slotRect = slot.getBoundingClientRect();
                    // Prüfen, ob die Mitte des Symbols im Schatten-Feld liegt
                    if (
                        symMitteX > slotRect.left &&
                        symMitteX < slotRect.right &&
                        symMitteY > slotRect.top &&
                        symMitteY < slotRect.bottom
                    ) {
                        treffer = true;
                        // Symbol exakt in den Schatten setzen
                        slot.innerHTML = '';
                        symbol.style.transform = 'none';
                        symbol.style.position = 'static';
                        symbol.style.cursor = 'default';
                        symbol.dataset.fertig = 'true';
                        slot.appendChild(symbol);

                        geloest++;
                        if (geloest === 4) {
                            setTimeout(() => {
                                document.getElementById('gewonnen-box').style.display = 'block';
                            }, 300);
                        }
                    }
                }
            });

            // Wenn daneben oder falscher Schatten -> sanft zurückgleiten
            if (!treffer) {
                symbol.style.transition = 'transform 0.3s ease';
                symbol.style.transform = 'translate(0px, 0px)';
                symbol.style.zIndex = 10;
            }
        });
    });
</script>

</body>
</html>
