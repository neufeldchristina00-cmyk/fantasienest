<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fantasienest - Schatten-Rätsel</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0;
            background-color: #1e272e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
        }

        #spiel-buehne {
            position: relative;
            width: 1000px;
            max-width: 98vw;
            aspect-ratio: 16 / 9;
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* Die 4 Schatten in der großen Steintafel */
        .slot {
            position: absolute;
            width: 8.5%;
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .schatten-bild {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Die 4 bunten Symbole in den 4 Stein-Kacheln darunter */
        .symbol-bild {
            position: absolute;
            width: 7.5%;
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%);
            object-fit: contain;
            cursor: grab;
            touch-action: none;
            z-index: 10;
        }

        .symbol-bild:active {
            cursor: grabbing;
        }

        /* Erfolgs-Nachricht am Ende */
        #gewonnen-box {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.96);
            padding: 25px 40px;
            border-radius: 20px;
            border: 5px solid #f39c12;
            text-align: center;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #gewonnen-box h2 { margin: 0 0 10px 0; color: #333; font-size: 26px; }
        #gewonnen-box p { margin: 0 0 20px 0; color: #555; font-size: 18px; }
        #gewonnen-box button {
            background: #27ae60; color: white; border: none;
            padding: 12px 24px; font-size: 18px; border-radius: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="spiel-buehne">
    <!-- 1. DIE 4 SCHATTEN (Exakt in der großen Steintafel platziert) -->
    <div class="slot" data-id="1" style="left: 41.2%; top: 58.0%;">
        <img src="images/schatten1.png" class="schatten-bild" draggable="false">
    </div>
    <div class="slot" data-id="2" style="left: 51.2%; top: 58.0%;">
        <img src="images/schatten2.png" class="schatten-bild" draggable="false">
    </div>
    <div class="slot" data-id="3" style="left: 61.2%; top: 58.0%;">
        <img src="images/schatten3.png" class="schatten-bild" draggable="false">
    </div>
    <div class="slot" data-id="4" style="left: 71.2%; top: 58.0%;">
        <img src="images/schatten4.png" class="schatten-bild" draggable="false">
    </div>

        <!-- 2. DIE 4 BUNTEN SYMBOLE (Exakt mittig in den 4 Stein-Kacheln) -->
    <img src="images/symbol3.png" class="symbol-bild" data-id="3" draggable="false" style="left: 42.1%; top: 80.2%;">
    <img src="images/symbol1.png" class="symbol-bild" data-id="1" draggable="false" style="left: 50.6%; top: 80.2%;">
    <img src="images/symbol4.png" class="symbol-bild" data-id="4" draggable="false" style="left: 59.1%; top: 80.2%;">
    <img src="images/symbol2.png" class="symbol-bild" data-id="2" draggable="false" style="left: 67.6%; top: 80.2%;">


    <!-- Gewinn-Fenster -->
    <div id="gewonnen-box">
        <h2>Rätsel gelöst! 🌟</h2>
        <p>Das Steintor öffnet sich! Alle 4 Schatten passen.</p>
        <button onclick="location.reload()">Nochmal spielen</button>
    </div>
</div>

<script>
    // Lädt das Hintergrundbild immer garantiert frisch von GitHub (ohne Cache-Probleme)
    document.getElementById('spiel-buehne').style.backgroundImage = `url('images/hintergrund.png?t=${Date.now()}')`;

    const symbole = document.querySelectorAll('.symbol-bild');
    const schattenSlots = document.querySelectorAll('.slot');
    let geloest = 0;

    symbole.forEach(symbol => {
        let startMausX = 0, startMausY = 0;
        let ziehtGerade = false;

        symbol.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (symbol.dataset.fertig === 'true') return;
            
            ziehtGerade = true;
            symbol.setPointerCapture(e.pointerId);
            startMausX = e.clientX;
            startMausY = e.clientY;
            symbol.style.zIndex = 50;
            symbol.style.transition = 'none';
        });

        symbol.addEventListener('pointermove', (e) => {
            if (!ziehtGerade) return;
            const dx = e.clientX - startMausX;
            const dy = e.clientY - startMausY;
            symbol.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.15)`;
        });

        symbol.addEventListener('pointerup', (e) => {
            if (!ziehtGerade) return;
            ziehtGerade = false;
            symbol.releasePointerCapture(e.pointerId);

            const symRect = symbol.getBoundingClientRect();
            const symMitteX = symRect.left + symRect.width / 2;
            const symMitteY = symRect.top + symRect.height / 2;

            let treffer = false;

            schattenSlots.forEach(slot => {
                if (slot.dataset.id === symbol.dataset.id) {
                    const slotRect = slot.getBoundingClientRect();
                    const toleranz = 15;
                    if (
                        symMitteX > (slotRect.left - toleranz) &&
                        symMitteX < (slotRect.right + toleranz) &&
                        symMitteY > (slotRect.top - toleranz) &&
                        symMitteY < (slotRect.bottom + toleranz)
                    ) {
                        treffer = true;
                        symbol.style.left = slot.style.left;
                        symbol.style.top = slot.style.top;
                        symbol.style.width = '8.5%';
                        symbol.style.transform = 'translate(-50%, -50%)';
                        symbol.style.cursor = 'default';
                        symbol.style.zIndex = 5;
                        symbol.dataset.fertig = 'true';
                        slot.style.visibility = 'hidden';

                        geloest++;
                        if (geloest === 4) {
                            setTimeout(() => {
                                document.getElementById('gewonnen-box').style.display = 'block';
                            }, 350);
                        }
                    }
                }
            });

            if (!treffer) {
                symbol.style.transition = 'transform 0.3s ease';
                symbol.style.transform = 'translate(-50%, -50%)';
                symbol.style.zIndex = 10;
            }
        });
    });
</script>

</body>
</html>
